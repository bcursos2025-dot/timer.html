<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronômetro de Estudo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#0f1115; --card:#171a21; --accent:#ff5a5f; --accent-soft:#ff5a5f22;
    --green:#2ecc71; --yellow:#f1c40f; --gray:#6b7280;
    --text:#f3f4f6; --text-dim:#9ca3af;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:360px; background:var(--card); border-radius:20px;
    padding:28px 24px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.35);
  }

  /* ---------- TELA DE PAREAMENTO ---------- */
  #telaPareamento h2{ font-size:18px; margin:0 0 6px; }
  #telaPareamento p{ font-size:13px; color:var(--text-dim); margin:0 0 22px; line-height:1.5; }
  #inputCodigo{
    width:100%; font-size:26px; letter-spacing:8px; text-align:center;
    padding:14px 0; border-radius:12px; border:1px solid #2a2d36;
    background:#0f1115; color:var(--text); margin-bottom:14px;
  }
  #inputCodigo:focus{ outline:none; border-color:var(--accent); }
  #erroPareamento{ color:var(--accent); font-size:12px; min-height:16px; margin-bottom:10px; }
  #btnParear{
    width:100%; border:none; border-radius:14px; padding:14px 0;
    font-size:15px; font-weight:600; cursor:pointer; background:var(--accent); color:#fff;
  }
  #btnParear:disabled{ opacity:.4; }

  /* ---------- TELA DO CRONÔMETRO ---------- */
  #telaTimer{ display:none; }
  .status{ display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--text-dim); margin-bottom:18px; }
  .dot{ width:9px;height:9px;border-radius:50%; background:var(--gray); transition:background .2s; }
  .dot.running{ background:var(--green); box-shadow:0 0 8px var(--green); }
  .dot.paused{ background:var(--yellow); box-shadow:0 0 8px var(--yellow); }

  /* Abas Foco / Pausa curta / Pausa longa */
  .abas{ display:flex; gap:8px; justify-content:center; margin-bottom:28px; flex-wrap:wrap; }
  .aba{
    padding:8px 14px; border-radius:20px; font-size:12px; font-weight:600;
    background:#1e222b; color:var(--text-dim); border:1px solid transparent;
    display:flex; align-items:center; gap:6px;
  }
  .aba.ativa{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .aba .contador{
    background:rgba(255,255,255,0.08); border-radius:10px; padding:1px 7px; font-size:11px;
  }
  .aba.ativa .contador{ background:var(--accent); color:#fff; }

  /* Anel circular */
  .anel-wrap{ position:relative; width:220px; height:220px; margin:0 auto 26px; }
  .anel-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .anel-fundo{ fill:none; stroke:#20242d; stroke-width:10; }
  .anel-progresso{ fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 0.3s linear; }
  .anel-conteudo{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .timer{ font-size:44px; font-weight:700; letter-spacing:1px; font-variant-numeric:tabular-nums; }
  .label{ color:var(--text-dim); font-size:11px; letter-spacing:1px; text-transform:uppercase; margin-top:4px; }

  .bloco{ background:var(--accent-soft); color:var(--accent); font-size:13px; padding:8px 12px; border-radius:10px; margin-bottom:18px; display:none; }
  .btns{ display:flex; gap:12px; }
  button{ flex:1; border:none; border-radius:14px; padding:14px 0; font-size:15px; font-weight:600; cursor:pointer; transition:opacity .15s, transform .1s; }
  button:active{ transform:scale(.97); }
  #btnPrimary{ background:var(--accent); color:#fff; }
  #btnStop{ background:#2a2d36; color:var(--text); }
  button:disabled{ opacity:.4; cursor:default; }
  .footer{ margin-top:20px; font-size:11px; color:var(--text-dim); }
  .offline{ color:var(--yellow); }
  .linkNovo{ margin-top:16px; font-size:11px; color:var(--text-dim); text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>

<div class="card">

  <!-- TELA 1: pareamento (só aparece na primeira vez) -->
  <div id="telaPareamento">
    <h2>Parear com o PC</h2>
    <p>Abra a extensão no computador, vá em <b>Configurações → Celular</b>
       e digite aqui o código de 6 dígitos mostrado lá.</p>
    <input id="inputCodigo" inputmode="numeric" maxlength="6" placeholder="000000">
    <div id="erroPareamento"></div>
    <button id="btnParear" disabled>Confirmar</button>
  </div>

  <!-- TELA 2: cronômetro (aparece depois de parear) -->
  <div id="telaTimer">
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusTexto">Conectando…</span>
    </div>

    <div class="abas" id="abas">
      <span class="aba" id="aba-foco">Foco</span>
      <span class="aba" id="aba-pausa-curta">Pausa curta</span>
    </div>

    <div class="anel-wrap">
      <svg viewBox="0 0 220 220">
        <circle class="anel-fundo" cx="110" cy="110" r="98"></circle>
        <circle class="anel-progresso" id="anelProgresso" cx="110" cy="110" r="98"
                stroke-dasharray="615.75" stroke-dashoffset="0"></circle>
      </svg>
      <div class="anel-conteudo">
        <div class="timer" id="timer">00:00</div>
        <div class="label" id="timerLabel">tempo estudado hoje</div>
      </div>
    </div>

    <div class="bloco" id="bloco"></div>
    <div class="btns">
      <button id="btnPrimary" disabled>Iniciar</button>
      <button id="btnStop" disabled>Parar</button>
    </div>
    <div class="footer" id="footer">sincronizando com o PC…</div>
    <div class="linkNovo" id="linkNovo">parear com outro PC</div>
  </div>

</div>

<script>
/* ============================================================
   CONFIGURAÇÃO DO FIREBASE — troque pelos dados do seu projeto
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAqpHJny30HIfedbdwq22Ex1K0QDllO5hw",
  authDomain: "concurseiro-blindado.firebaseapp.com",
  databaseURL: "https://concurseiro-blindado-default-rtdb.firebaseio.com", // CONFIRMAR: cole a URL exata mostrada no console
  projectId: "concurseiro-blindado",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

/* ============================================================
   PAREAMENTO
   - A extensão, ao gerar o código, grava em:
       pareamentos/{codigo} = { deviceId, criadoEm }
   - Aqui a gente lê esse nó, pega o deviceId real, e guarda
     ele localmente (localStorage funciona dentro do Telegram
     WebView normalmente — só o login do Google que é bloqueado,
     armazenamento local não tem esse problema).
   - Os dados de estudo em si moram em: dispositivos/{deviceId}
   ============================================================ */
const CHAVE_LOCAL = 'cb_deviceId';

const telaPareamento = document.getElementById('telaPareamento');
const telaTimer = document.getElementById('telaTimer');
const inputCodigo = document.getElementById('inputCodigo');
const btnParear = document.getElementById('btnParear');
const erroPareamento = document.getElementById('erroPareamento');
const linkNovo = document.getElementById('linkNovo');

inputCodigo.addEventListener('input', () => {
  inputCodigo.value = inputCodigo.value.replace(/\D/g, '').slice(0, 6);
  btnParear.disabled = inputCodigo.value.length !== 6;
});

btnParear.addEventListener('click', async () => {
  const codigo = inputCodigo.value;
  btnParear.disabled = true;
  erroPareamento.textContent = '';
  try {
    const snap = await db.ref('pareamentos/' + codigo).once('value');
    const dado = snap.val();
    if (!dado || !dado.deviceId) {
      erroPareamento.textContent = 'Código inválido ou expirado. Gere um novo na extensão.';
      btnParear.disabled = false;
      return;
    }
    localStorage.setItem(CHAVE_LOCAL, dado.deviceId);
    iniciarCronometro(dado.deviceId);
  } catch (e) {
    erroPareamento.textContent = 'Falha de conexão. Tente de novo.';
    btnParear.disabled = false;
  }
});

linkNovo.addEventListener('click', () => {
  localStorage.removeItem(CHAVE_LOCAL);
  telaTimer.style.display = 'none';
  telaPareamento.style.display = 'block';
  inputCodigo.value = '';
  btnParear.disabled = true;
});

/* ============================================================
   TELA DO CRONÔMETRO
   ============================================================ */
const elTimer = document.getElementById('timer');
const elTimerLabel = document.getElementById('timerLabel');
const elStatus = document.getElementById('statusTexto');
const elDot = document.getElementById('dot');
const elBloco = document.getElementById('bloco');
const elFooter = document.getElementById('footer');
const elAnel = document.getElementById('anelProgresso');
const elAbaFoco = document.getElementById('aba-foco');
const elAbaPausa = document.getElementById('aba-pausa-curta');
const btnPrimary = document.getElementById('btnPrimary');
const btnStop = document.getElementById('btnStop');

const RAIO = 98;
const CIRCUNFERENCIA = 2 * Math.PI * RAIO; // ~615.75

let estadoAtual = null;
let tickInterval = null;
let refAtual = null;

function fmtCurto(totalSegundos){
  const s = Math.max(0, Math.floor(totalSegundos));
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${m}:${sec}`;
}

function fmt(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const h = String(Math.floor(s/3600)).padStart(2,'0');
  const m = String(Math.floor((s%3600)/60)).padStart(2,'0');
  const sec = String(s%60).padStart(2,'0');
  return `${h}:${m}:${sec}`;
}

function definirProgressoAnel(fracao){
  // fracao: 0 (vazio) a 1 (cheio). O anel desenha de forma decrescente
  // (como um Pomodoro esvaziando), por isso invertemos o offset.
  const offset = CIRCUNFERENCIA * (1 - fracao);
  elAnel.style.strokeDashoffset = offset;
}

function render(){
  if (!estadoAtual){
    elStatus.textContent = 'Sem dados ainda';
    elFooter.textContent = 'abra a extensão no PC pelo menos uma vez';
    return;
  }
  const { sessionState, msHoje, inicioSessao, bloco, pomodoroMode, pomodoroState, pomodoroEndAt, pomodoroTimeLeft } = estadoAtual;

  elDot.className = 'dot' + (sessionState === 'running' ? ' running'
                    : sessionState?.startsWith('paused') ? ' paused' : '');
  elStatus.textContent = sessionState === 'running' ? 'Estudando agora'
                        : sessionState?.startsWith('paused') ? 'Pausado' : 'Parado';

  btnPrimary.disabled = false;
  btnStop.disabled = sessionState === 'stopped';
  btnPrimary.textContent = sessionState === 'running' ? 'Pausar' : 'Continuar';

  if (bloco){
    elBloco.style.display = 'block';
    elBloco.textContent = `📋 ${bloco.materia || bloco.tipo} (${bloco.inicio}–${bloco.fim})`;
  } else {
    elBloco.style.display = 'none';
  }

  clearInterval(tickInterval);

  if (pomodoroMode) {
    // MODO POMODORO: mostra a MESMA contagem regressiva do PC (não uma
    // simulação local) — os números vêm de pomodoroEndAt, que é o
    // timestamp real de quando o ciclo termina, calculado no PC.
    document.getElementById('abas').style.display = 'flex';
    const emFoco = pomodoroState !== 'rest';
    elAbaFoco.classList.toggle('ativa', emFoco);
    elAbaPausa.classList.toggle('ativa', !emFoco);
    elTimerLabel.textContent = emFoco ? 'sessão de foco' : 'pausa';

    const duracaoTotal = emFoco
      ? (pomodoroEndAt && sessionState === 'running' ? null : pomodoroTimeLeft) // fallback quando pausado
      : pomodoroTimeLeft;

    if (window.__cbUltimaFase !== pomodoroState) {
      window.__cbUltimaFase = pomodoroState;
      window.__cbCicloRef = null;
    }

    function atualizarPomodoro(){
      let restanteSeg;
      if (sessionState === 'running' && pomodoroEndAt) {
        restanteSeg = Math.max(0, Math.round((pomodoroEndAt - Date.now()) / 1000));
      } else {
        restanteSeg = pomodoroTimeLeft || 0;
      }
      elTimer.textContent = fmtCurto(restanteSeg);

      // Progresso do anel: precisa saber a duração total do ciclo atual
      // pra calcular a fração restante — como não temos esse número
      // exato aqui (só o "tempo restante"), usamos o maior valor já
      // visto no ciclo como referência aproximada de 100%.
      if (!window.__cbCicloRef || window.__cbCicloRef < restanteSeg) {
        window.__cbCicloRef = restanteSeg || 1;
      }
      definirProgressoAnel(restanteSeg / (window.__cbCicloRef || 1));
    }

    atualizarPomodoro();
    if (sessionState === 'running') {
      tickInterval = setInterval(atualizarPomodoro, 1000);
    }

  } else {
    // MODO SIMPLES (sem Pomodoro): mostra tempo total estudado hoje,
    // contando pra frente — o anel vai enchendo (não esvaziando).
    document.getElementById('abas').style.display = 'none';
    elTimerLabel.textContent = 'tempo estudado hoje';

    function atualizarSimples(){
      let msTotal = msHoje || 0;
      if (sessionState === 'running' && inicioSessao) msTotal += (Date.now() - inicioSessao);
      elTimer.textContent = fmt(msTotal).slice(0, 5); // mm:ss visual no anel; texto completo teria hh
      // Referência visual: enche o anel a cada hora completa.
      const fracaoHora = (msTotal % (60 * 60 * 1000)) / (60 * 60 * 1000);
      definirProgressoAnel(fracaoHora);
    }

    atualizarSimples();
    if (sessionState === 'running') {
      tickInterval = setInterval(atualizarSimples, 1000);
    }
  }

  elFooter.textContent = 'sincronizado com o PC em tempo real';
  elFooter.classList.remove('offline');
}

function enviarComando(acao){
  if (!refAtual) {
    elFooter.textContent = 'Erro: ainda não conectado ao dispositivo (refAtual vazio).';
    elFooter.classList.add('offline');
    return;
  }
  elFooter.textContent = 'enviando comando...';
  refAtual.child('comandoRemoto').set({ acao, ts: Date.now() })
    .then(() => {
      elFooter.textContent = 'comando enviado ✓ (aguardando o PC aplicar, ~10s)';
      elFooter.classList.remove('offline');
    })
    .catch((erro) => {
      elFooter.textContent = 'Falha ao enviar: ' + (erro && erro.message ? erro.message : erro);
      elFooter.classList.add('offline');
    });
  tg?.HapticFeedback?.impactOccurred('light');
}

btnPrimary.addEventListener('click', () => {
  if (!estadoAtual) return;
  enviarComando(estadoAtual.sessionState === 'running' ? 'pausar' : 'continuar');
});
btnStop.addEventListener('click', () => enviarComando('parar'));

function iniciarCronometro(deviceId){
  telaPareamento.style.display = 'none';
  telaTimer.style.display = 'block';

  let recebeuAlgumaResposta = false;
  const timeoutConexao = setTimeout(() => {
    if (!recebeuAlgumaResposta) {
      elStatus.textContent = 'Sem resposta do servidor';
      elFooter.textContent = 'Verifique: extensão recarregada no PC? Regras do Firebase publicadas? Sessão de estudo já foi iniciada ao menos 1x?';
      elFooter.classList.add('offline');
    }
  }, 8000);

  refAtual = db.ref('dispositivos/' + deviceId);
  refAtual.on('value', (snap) => {
    recebeuAlgumaResposta = true;
    clearTimeout(timeoutConexao);
    estadoAtual = snap.val();
    render();
  }, (erro) => {
    recebeuAlgumaResposta = true;
    clearTimeout(timeoutConexao);
    elStatus.textContent = 'Erro de permissão';
    elFooter.textContent = 'As regras do Realtime Database não foram publicadas ainda (aba Regras no console do Firebase).';
    elFooter.classList.add('offline');
    console.error('Erro Firebase:', erro);
  });
}

/* ============================================================
   BOOT: já pareado antes? pula direto pro cronômetro
   ============================================================ */
const deviceIdSalvo = localStorage.getItem(CHAVE_LOCAL);
if (deviceIdSalvo){
  iniciarCronometro(deviceIdSalvo);
} else {
  telaPareamento.style.display = 'block';
}
</script>

</body>
</html>
