<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090c">
<title>Leis com grifos — Concurseiro Blindado</title>
<meta name="description" content="Leis do Planalto atualizadas, com busca e marca-texto em tempo real. Seus grifos ficam salvos no seu aparelho.">
<script>try{var _t=localStorage.getItem("cb_tema");document.documentElement.dataset.theme=(_t==="light"||_t==="navy")?_t:"dark";}catch(e){document.documentElement.dataset.theme="dark";}</script>
<link rel="stylesheet" href="css/landing.css">
<link rel="stylesheet" href="css/leis.css">
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="marca" href="index.html" aria-label="Concurseiro Blindado">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 4.5 5.5v6c0 4.7 3.1 8.3 7.5 10 4.4-1.7 7.5-5.3 7.5-10v-6z"/><polyline points="8.8 12.2 11.2 14.6 15.4 9.8"/></svg></span>
      Concurseiro Blindado
    </a>
    <nav class="nav-links" aria-label="Páginas">
      <a href="timer.html">App</a>
      <a href="leis.html" aria-current="page">Leis</a>
      <a href="instalar.html">Extensão</a>
    </nav>
    <a class="btn principal pequeno" href="timer.html">Abrir o app</a>
  </div>
</header>

<main class="leis">
  <div class="l-wrap">
    <h1>Leis com grifos</h1>
    <p class="l-sub">Texto do Planalto, com busca e marca-texto em tempo real. Selecione um trecho para grifar.</p>

    <div class="l-controles">
      <label class="l-campo l-lei"><span>Lei</span>
        <select id="selLei" aria-label="Escolher a lei"></select>
      </label>
      <label class="l-campo l-busca"><span>Buscar</span>
        <input id="inpBusca" type="search" placeholder="palavra ou expressão" autocomplete="off" aria-label="Buscar no texto">
      </label>
      <label class="l-campo l-ir"><span>Ir ao art.</span>
        <input id="inpIr" type="text" inputmode="text" placeholder="ex.: 7" autocomplete="off" aria-label="Ir ao artigo">
      </label>
      <button class="btn pequeno" id="btnGrifos" type="button">Meus grifos <b id="numGrifos">0</b></button>
    </div>
    <div class="l-escopo"><label><input type="checkbox" id="chkTodas"> buscar em todas as leis</label></div>

    <div class="l-info" id="infoLei" hidden></div>

    <div class="l-legenda" id="legenda" aria-label="Legenda das cores"></div>

    <section id="resultados" class="l-resultados" hidden aria-live="polite"></section>
    <article id="texto" class="l-texto" aria-label="Texto da lei"></article>
    <div class="l-mais" id="maisWrap" hidden><button class="btn" id="btnMais" type="button">Mostrar mais</button></div>
  </div>
</main>

<!-- barra flutuante de grifar -->
<div class="g-barra" id="gBarra" hidden role="toolbar" aria-label="Grifar">
  <div class="g-cores" id="gCores"></div>
  <span class="g-div" aria-hidden="true"></span>
  <button type="button" class="g-ic" id="gSub" title="Sublinhar em vez de grifar" aria-label="Sublinhar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a6 6 0 0 0 12 0V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg></button>
  <button type="button" class="g-ic" id="gNeg" title="Negrito" aria-label="Negrito"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/></svg></button>
  <button type="button" class="g-ic" id="gNota" title="Grifar e escrever uma nota" aria-label="Nota"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
  <button type="button" class="g-apagar" id="gRemover" title="Apagar este grifo" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>Apagar</button>
  <button type="button" class="g-ic" id="gFechar" title="Fechar" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <div class="g-paleta" id="gPaleta" hidden><div class="g-paleta-grade" id="gPaletaGrade"></div><div class="g-paleta-nome" id="gPaletaNome"></div></div>
  <div class="g-notaWrap" id="gNotaWrap" hidden>
    <textarea id="gNotaTxt" rows="2" maxlength="1000" placeholder="Sua anotação sobre este trecho"></textarea>
    <button type="button" class="btn pequeno principal" id="gNotaSalvar">Salvar nota</button>
  </div>
</div>

<!-- gaveta: meus grifos -->
<aside class="g-gaveta" id="gGaveta" hidden aria-label="Meus grifos">
  <div class="g-gav-topo">
    <h2>Meus grifos</h2>
    <button type="button" class="g-bt" id="gGavFechar" aria-label="Fechar">×</button>
  </div>
  <div class="g-gav-filtros" id="gFiltros"></div>
  <div class="g-gav-lista" id="gLista"></div>
  <div class="g-gav-rodape">
    <button type="button" class="btn pequeno" id="gExportar">Exportar</button>
    <label class="btn pequeno" for="gImportar">Importar</label>
    <input type="file" id="gImportar" accept="application/json" hidden>
  </div>
</aside>

<div class="l-toast" id="toast" hidden role="status"></div>

<script src="js/leis.js"></script>
</body>
</html>
